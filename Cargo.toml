[package]
name = "sentinella-hub-k8s-agent"
version = "0.19.4"
edition = "2024"
rust-version = "1.85"
description = "Sentinella Hub Kubernetes Agent — collects cluster inventory and (future) executes actions"

[[bin]]
name = "sentinella-hub-k8s-agent"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "signal", "time"] }

# Kubernetes client
kube = { version = "3", default-features = false, features = ["client", "rustls-tls"] }
k8s-openapi = { version = "0.27", features = ["latest"] }
kube-leader-election = "0.43"

# HTTP client to the Hub
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls", "http2"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors / logging
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Health/metrics server
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
prometheus = "0.13"
once_cell = "1"
time = { version = "0.3", features = ["parsing", "formatting"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
