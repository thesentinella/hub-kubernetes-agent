---
apiVersion: v1
kind: Namespace
metadata:
  name: sentinella
  labels:
    app.kubernetes.io/part-of: sentinella
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinella-hub-k8s-agent
  namespace: sentinella
---
# Cluster-wide READ-ONLY permissions for inventory collection.
# Action Mode eligibility is operator-managed: namespaces are labeled with
# sentinella.io/action-mode=true unless they are excluded or explicitly opted
# out with sentinella.io/action-mode=false, and action RBAC is granted
# separately via namespace-scoped Role/RoleBinding entries in the eligible
# namespaces.
# Do not expand this read-only role with mutating verbs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sentinella-hub-k8s-agent-reader
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - namespaces
      - pods
      - services
      - configmaps
      - persistentvolumeclaims
      - persistentvolumes
      - events
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling.k8s.io"]
    resources:
      - verticalpodautoscalers
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - limitranges
      - resourcequotas
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - clusterrolebindings
    verbs: ["get", "list", "watch"]
  - apiGroups: ["config.openshift.io"]
    resources:
      - clusterversions
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources:
      - volumesnapshotclasses
      - volumesnapshots
    verbs: ["get", "list", "watch"]
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sentinellahubactionpolicies.sentinella.io
spec:
  group: sentinella.io
  scope: Cluster
  names:
    plural: sentinellahubactionpolicies
    singular: sentinellahubactionpolicy
    kind: SentinellaHubActionPolicy
    listKind: SentinellaHubActionPolicyList
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                namespaceSelector:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                allowedActions:
                  type: array
                  items:
                    type: string
                allowedResources:
                  type: array
                  items:
                    type: string
                approvalRequired:
                  type: boolean
                limits:
                  type: object
                  properties:
                    maxCpuLimit:
                      type: string
                    maxMemoryLimit:
                      type: string
            status:
              type: object
              properties:
                effectiveNamespaces:
                  type: array
                  items:
                    type: string
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                observedGeneration:
                  type: integer
                  format: int64
                lastReconciledAtMs:
                  type: string
                  pattern: '^\d+$'
                stale:
                  type: boolean
---
# Operator RBAC: used by the dedicated operator Deployment.
# The operator needs to reconcile RoleBindings and write policy status, so
# keep the policy/status permissions scoped to the CRD and its status subresource.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sentinella-hub-k8s-agent-action-operator
rules:
  - apiGroups: [""]
    resources:
      - namespaces
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - rolebindings
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["sentinella.io"]
    resources:
      - sentinellahubactionpolicies
    verbs: ["get", "list", "watch"]
  - apiGroups: ["sentinella.io"]
    resources:
      - sentinellahubactionpolicies/status
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sentinella-hub-k8s-agent-action-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sentinella-hub-k8s-agent-action-operator
subjects:
  - kind: ServiceAccount
    name: sentinella-hub-k8s-operator
    namespace: sentinella
---
# Action Mode RBAC: workload patch permissions for labeled namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sentinella-hub-k8s-agent-action-mode
rules:
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources:
      - deployments/scale
      - statefulsets/scale
      - daemonsets/scale
    verbs: ["get", "patch"]
---
# Drain node RBAC: separate cluster-wide privilege for explicit drain-node opt-in.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sentinella-hub-k8s-agent-drain-node
rules:
  - apiGroups: [""]
    resources:
      - nodes
    verbs: ["patch"]
  - apiGroups: [""]
    resources:
      - pods/eviction
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sentinella-hub-k8s-agent-drain-node
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sentinella-hub-k8s-agent-drain-node
subjects:
  - kind: ServiceAccount
    name: sentinella-hub-k8s-agent
    namespace: sentinella
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sentinella-hub-k8s-agent-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sentinella-hub-k8s-agent-reader
subjects:
  - kind: ServiceAccount
    name: sentinella-hub-k8s-agent
    namespace: sentinella
---
# Namespace-scoped RBAC for the Lease used in leader election.
# This is intentionally a Role (not ClusterRole) — the lease lives only in the
# agent's own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sentinella-hub-k8s-agent-leader-election
  namespace: sentinella
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sentinella-hub-k8s-agent-leader-election
  namespace: sentinella
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sentinella-hub-k8s-agent-leader-election
subjects:
  - kind: ServiceAccount
    name: sentinella-hub-k8s-agent
    namespace: sentinella
---
# Namespace-scoped RBAC for the agent to dynamically manage the operator
# ServiceAccount and Deployment. The agent leader creates these resources
# when ACTION_OPERATOR_ENABLED=true and removes them when false.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sentinella-hub-k8s-agent-operator-lifecycle
  namespace: sentinella
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sentinella-hub-k8s-agent-operator-lifecycle
  namespace: sentinella
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sentinella-hub-k8s-agent-operator-lifecycle
subjects:
  - kind: ServiceAccount
    name: sentinella-hub-k8s-agent
    namespace: sentinella
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinella-hub-k8s-agent-config
  namespace: sentinella
data:
  HUB_URL: "https://api.hub.sentinel.la"
  CLUSTER_ID: "REPLACE_ME"           # unique per cluster
  COLLECT_INTERVAL_SECS: "60"
  POLL_WAIT_SECS: "30"
  HTTP_TIMEOUT_SECS: "20"
  LEASE_TTL_SECS: "30"
  ACTION_OPERATOR_ENABLED: "false"    # when true, the agent leader dynamically creates the operator Deployment and enables mutating actions
  ACTION_OPERATOR_POLL_INTERVAL_SECS: "60"  # reconcile interval when operator mode is enabled
  ACTION_OPERATOR_EXCLUDED_NAMESPACES: ""  # comma-separated extra namespaces; built-in exclusions are always applied in code
  POSTGRESQL_READONLY_COMMANDS_ENABLED: "false"  # opt-in; enables read-only PostgreSQL diagnostics
  COLLECT_SECRETS: "false"           # requires separate secrets-reader RBAC when true
  COLLECT_DEPENDENCIES_TETRAGON: "false"  # opt-in; requires Tetragon with gRPC enabled
  TETRAGON_ENDPOINT_DISCOVERY_ENABLED: "true"  # default-on; falls back to TETRAGON_GRPC_ADDRESS if discovery fails
  TETRAGON_REQUIRED_FOR_READINESS: "true" # set false in dev if Tetragon is unavailable on a node
  TETRAGON_GRPC_ADDRESS: "tetragon-grpc.tetragon.svc.cluster.local:54321"
  TETRAGON_GRPC_PORT: "54321"
  TETRAGON_SERVICE_NAMESPACE: "tetragon"
  TETRAGON_SERVICE_NAME: "tetragon-grpc"
  FULL_DEBUG: "false"                 # last resort only; emits full payloads and bodies
  AGENT_HTTP_DEBUG: "false"
  AGENT_HTTP_DEBUG_BODIES: "false"
  AGENT_LOG: "info"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinella-hub-app-metrics-config
  namespace: sentinella
data:
  APP_METRICS_ENABLED: "false"               # opt-in; app-level Prometheus scrape projection
  APP_METRICS_DISCOVERY_ENABLED: "true"      # discover Services via Prometheus / sentinella annotations
  APP_METRICS_NAMESPACES: ""                 # comma-separated allowlist; empty disables app metrics
  APP_METRICS_ALLOWLIST: "demo_usuarios_activos,demo_cola_tramites_pendientes,demo_operaciones_negocio_total,demo_lecturas_bd_total,demo_escrituras_bd_total,http_server_requests_seconds_*,jvm_memory_used_bytes,jvm_gc_pause_seconds_*,process_cpu_usage,system_cpu_usage,hikaricp_connections_*,jdbc_connections_*,tomcat_threads_*,tomcat_sessions_active_current"  # metric name allowlist / prefix filter
  APP_METRICS_TIMEOUT_SECS: "3"              # per-target scrape timeout
  APP_METRICS_MAX_SAMPLES: "500"             # max parsed samples per target
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinella-hub-workload-monitoring-config
  namespace: sentinella
data:
  WORKLOAD_MONITORING_ENABLED: "false"      # opt-in; namespace-scoped plugin
  WORKLOAD_MONITORING_NAMESPACES: ""         # comma-separated allowlist; empty disables the plugin
  WORKLOAD_MONITORING_TARGETS: "angular,spring_boot,oracle_database"
  POSTGRESQL_MONITORING_ENABLED: "false"     # opt-in; discovery-only namespace-scoped plugin
  POSTGRESQL_MONITORING_NAMESPACES: ""       # comma-separated allowlist; empty disables the plugin
  POSTGRESQL_MONITORING_SECRET_NAME: ""      # optional Secret name in target namespaces
  POSTGRESQL_MONITORING_HOST: ""             # env fallback; defaults to discovered Service DNS
  POSTGRESQL_MONITORING_PORT: ""             # env fallback; defaults to the discovered Service port
  POSTGRESQL_MONITORING_USER: ""             # env fallback; defaults to postgres
  POSTGRESQL_MONITORING_DATABASE: ""         # env fallback; defaults to postgres
  POSTGRESQL_MONITORING_SSLMODE: "require"   # env fallback; prefer TLS by default
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sentinella-hub-k8s-agent
  namespace: sentinella
  labels:
    app.kubernetes.io/name: sentinella-hub-k8s-agent
    app.kubernetes.io/part-of: sentinella
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinella-hub-k8s-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinella-hub-k8s-agent
        app.kubernetes.io/part-of: sentinella
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: sentinella-hub-k8s-agent
      terminationGracePeriodSeconds: 30
      # Schedule on every node, including control plane and tainted nodes.
      # Trim this if you want a smaller footprint.
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: us-east1-docker.pkg.dev/sentinella-hub/kubernetes-agent/sentinella-hub-k8s-agent:v1.5.5  # x-release-please-version
          imagePullPolicy: IfNotPresent
          args: ["--mode", "agent"]
          envFrom:
            # These ConfigMaps are intentionally non-overlapping; duplicate keys would override later entries.
            - configMapRef:
                name: sentinella-hub-k8s-agent-config
            - configMapRef:
                name: sentinella-hub-app-metrics-config
            - configMapRef:
                name: sentinella-hub-workload-monitoring-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HUB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sentinella-hub-k8s-agent-auth
                  key: api-key
                  optional: true
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          startupProbe:
            httpGet:
              path: /livez
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
