name: Build & Push to Artifact Registry

on:
  push:
    branches: [main]

env:
  PROJECT_ID: sentinella-hub
  REGION: us-east1
  REPOSITORY: kubernetes-agent
  IMAGE: sentinella-hub-k8s-agent

jobs:
  build-amd64:
    name: Build image (linux/amd64)
    runs-on: ubuntu-latest
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(main): release') }}"
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tags
        id: vars
        run: |
          echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          BASE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}"
          echo "image_sha=${BASE}:${GITHUB_SHA::7}-amd64" >> $GITHUB_OUTPUT

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.vars.outputs.image_sha }}
          cache-from: type=registry,ref=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest-amd64
          cache-to: type=inline

  build-arm64:
    name: Build image (linux/arm64)
    runs-on: ubuntu-24.04-arm
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(main): release') }}"
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tags
        id: vars
        run: |
          echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          BASE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}"
          echo "image_sha=${BASE}:${GITHUB_SHA::7}-arm64" >> $GITHUB_OUTPUT

      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.vars.outputs.image_sha }}
          cache-from: type=registry,ref=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest-arm64
          cache-to: type=inline

  merge-manifest:
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(main): release') }}"
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Merge per-arch images into a multi-arch manifest
        id: vars
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          BASE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}"
          SHA="${GITHUB_SHA::7}"
          docker buildx imagetools create --tag "${BASE}:${SHA}" \
            "${BASE}:${SHA}-amd64" \
            "${BASE}:${SHA}-arm64"
          echo "image_sha=${BASE}:${SHA}" >> $GITHUB_OUTPUT

      - name: Notify Slack — success
        if: success()
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ secrets.SLACK_CHANNEL_ID }}"
            text: ":white_check_mark: *${{ github.repository }}* image pushed"
            attachments:
              - color: "good"
                fields:
                  - title: "Branch"
                    value: "${{ github.ref_name }}"
                    short: true
                  - title: "Commit"
                    value: "<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${GITHUB_SHA::7}> ${{ env.COMMIT_MSG }}"
                    short: false
                  - title: "Image"
                    value: "`${{ steps.vars.outputs.image_sha }}`"
                    short: false
                  - title: "By"
                    value: "${{ github.actor }}"
                    short: true

      - name: Notify Slack — failure
        if: failure()
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ secrets.SLACK_CHANNEL_ID }}"
            text: ":x: *${{ github.repository }}* build failed"
            attachments:
              - color: "danger"
                fields:
                  - title: "Branch"
                    value: "${{ github.ref_name }}"
                    short: true
                  - title: "Run"
                    value: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver logs>"
                    short: true
                  - title: "By"
                    value: "${{ github.actor }}"
                    short: true
