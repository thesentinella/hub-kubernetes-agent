name: Build & Push to GHCR

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE: sentinella-hub-k8s-agent

jobs:
  build-amd64:
    name: Build image (linux/amd64)
    runs-on: ubuntu-latest

    if: "${{ !startsWith(github.event.head_commit.message, 'chore(main): release') }}"

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set image tags
        id: vars
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          BASE="${REGISTRY}/${OWNER}/${IMAGE}"
          SHA_SHORT="${GITHUB_SHA::7}"

          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "image_sha=${BASE}:${SHA_SHORT}-amd64" >> "$GITHUB_OUTPUT"

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.vars.outputs.image_sha }}

          cache-from: type=gha,scope=${{ env.IMAGE }}-amd64
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE }}-amd64


  build-arm64:
    name: Build image (linux/arm64)
    runs-on: ubuntu-24.04-arm

    if: "${{ !startsWith(github.event.head_commit.message, 'chore(main): release') }}"

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set image tags
        id: vars
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          BASE="${REGISTRY}/${OWNER}/${IMAGE}"
          SHA_SHORT="${GITHUB_SHA::7}"

          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "image_sha=${BASE}:${SHA_SHORT}-arm64" >> "$GITHUB_OUTPUT"

      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.vars.outputs.image_sha }}

          cache-from: type=gha,scope=${{ env.IMAGE }}-arm64
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE }}-arm64


  merge-manifest:
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest

    needs:
      - build-amd64
      - build-arm64

    if: "${{ !startsWith(github.event.head_commit.message, 'chore(main): release') }}"

    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Merge per-arch images into multi-arch manifest
        id: vars
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          BASE="${REGISTRY}/${OWNER}/${IMAGE}"
          SHA_SHORT="${GITHUB_SHA::7}"

          docker buildx imagetools create \
            --tag "${BASE}:${SHA_SHORT}" \
            "${BASE}:${SHA_SHORT}-amd64" \
            "${BASE}:${SHA_SHORT}-arm64"

          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "image_sha=${BASE}:${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Inspect multi-arch image
        run: |
          docker buildx imagetools inspect \
            "${{ steps.vars.outputs.image_sha }}"

      - name: Notify Slack — success
        if: success()
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ secrets.SLACK_CHANNEL_ID }}"
            text: ":white_check_mark: *${{ github.repository }}* image pushed"
            attachments:
              - color: "good"
                fields:
                  - title: "Branch"
                    value: "${{ github.ref_name }}"
                    short: true

                  - title: "Commit"
                    value: "<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ steps.vars.outputs.sha_short }}>"
                    short: true

                  - title: "Commit message"
                    value: ${{ toJSON(github.event.head_commit.message) }}
                    short: false

                  - title: "Image"
                    value: "`${{ steps.vars.outputs.image_sha }}`"
                    short: false

                  - title: "By"
                    value: "${{ github.actor }}"
                    short: true


  notify-failure:
    name: Notify Slack — failure
    runs-on: ubuntu-latest

    needs:
      - build-amd64
      - build-arm64
      - merge-manifest

    if: >-
      always() &&
      !startsWith(github.event.head_commit.message, 'chore(main): release') &&
      (
        needs.build-amd64.result == 'failure' ||
        needs.build-arm64.result == 'failure' ||
        needs.merge-manifest.result == 'failure'
      )

    permissions:
      contents: read

    steps:
      - name: Notify Slack — failure
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ secrets.SLACK_CHANNEL_ID }}"
            text: ":x: *${{ github.repository }}* build failed"
            attachments:
              - color: "danger"
                fields:
                  - title: "Branch"
                    value: "${{ github.ref_name }}"
                    short: true

                  - title: "Build status"
                    value: "amd64=${{ needs.build-amd64.result }}, arm64=${{ needs.build-arm64.result }}, manifest=${{ needs.merge-manifest.result }}"
                    short: false

                  - title: "Run"
                    value: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver logs>"
                    short: true

                  - title: "By"
                    value: "${{ github.actor }}"
                    short: true
