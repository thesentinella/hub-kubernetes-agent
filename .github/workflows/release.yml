name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'sentinella-hub-k8s-agent-v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE: sentinella-hub-k8s-agent

jobs:
  build-amd64:
    name: Build image (linux/amd64)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set image vars
        id: vars
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          BASE="${REGISTRY}/${OWNER}/${IMAGE}"

          VERSION_V="${GITHUB_REF_NAME#sentinella-hub-k8s-agent-}"
          VERSION="${VERSION_V#v}"
          SHA_SHORT="${GITHUB_SHA::7}"

          echo "version_v=${VERSION_V}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"

          echo "image_version_v=${BASE}:${VERSION_V}-amd64" >> "$GITHUB_OUTPUT"
          echo "image_version=${BASE}:${VERSION}-amd64" >> "$GITHUB_OUTPUT"
          echo "image_sha=${BASE}:${SHA_SHORT}-amd64" >> "$GITHUB_OUTPUT"
          echo "image_latest=${BASE}:latest-amd64" >> "$GITHUB_OUTPUT"

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.vars.outputs.image_version_v }}
            ${{ steps.vars.outputs.image_version }}
            ${{ steps.vars.outputs.image_sha }}
            ${{ steps.vars.outputs.image_latest }}

          cache-from: type=registry,ref=${{ steps.vars.outputs.image_latest }}
          cache-to: type=inline


  build-arm64:
    name: Build image (linux/arm64)
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set image vars
        id: vars
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          BASE="${REGISTRY}/${OWNER}/${IMAGE}"

          VERSION_V="${GITHUB_REF_NAME#sentinella-hub-k8s-agent-}"
          VERSION="${VERSION_V#v}"
          SHA_SHORT="${GITHUB_SHA::7}"

          echo "version_v=${VERSION_V}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"

          echo "image_version_v=${BASE}:${VERSION_V}-arm64" >> "$GITHUB_OUTPUT"
          echo "image_version=${BASE}:${VERSION}-arm64" >> "$GITHUB_OUTPUT"
          echo "image_sha=${BASE}:${SHA_SHORT}-arm64" >> "$GITHUB_OUTPUT"
          echo "image_latest=${BASE}:latest-arm64" >> "$GITHUB_OUTPUT"

      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.vars.outputs.image_version_v }}
            ${{ steps.vars.outputs.image_version }}
            ${{ steps.vars.outputs.image_sha }}
            ${{ steps.vars.outputs.image_latest }}

          cache-from: type=registry,ref=${{ steps.vars.outputs.image_latest }}
          cache-to: type=inline


  merge-manifest:
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest

    needs:
      - build-amd64
      - build-arm64

    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set image vars
        id: vars
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          BASE="${REGISTRY}/${OWNER}/${IMAGE}"

          VERSION_V="${GITHUB_REF_NAME#sentinella-hub-k8s-agent-}"
          VERSION="${VERSION_V#v}"
          SHA_SHORT="${GITHUB_SHA::7}"

          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "version_v=${VERSION_V}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"

          echo "image_version_v=${BASE}:${VERSION_V}" >> "$GITHUB_OUTPUT"
          echo "image_version=${BASE}:${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image_sha=${BASE}:${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${BASE}:latest" >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifests
        shell: bash
        run: |
          BASE="${{ steps.vars.outputs.base }}"
          VERSION_V="${{ steps.vars.outputs.version_v }}"
          VERSION="${{ steps.vars.outputs.version }}"
          SHA_SHORT="${{ steps.vars.outputs.sha_short }}"

          echo "Creating ${BASE}:${VERSION_V}"
          docker buildx imagetools create \
            --tag "${BASE}:${VERSION_V}" \
            "${BASE}:${VERSION_V}-amd64" \
            "${BASE}:${VERSION_V}-arm64"

          echo "Creating ${BASE}:${VERSION}"
          docker buildx imagetools create \
            --tag "${BASE}:${VERSION}" \
            "${BASE}:${VERSION}-amd64" \
            "${BASE}:${VERSION}-arm64"

          echo "Creating ${BASE}:${SHA_SHORT}"
          docker buildx imagetools create \
            --tag "${BASE}:${SHA_SHORT}" \
            "${BASE}:${SHA_SHORT}-amd64" \
            "${BASE}:${SHA_SHORT}-arm64"

          echo "Creating ${BASE}:latest"
          docker buildx imagetools create \
            --tag "${BASE}:latest" \
            "${BASE}:latest-amd64" \
            "${BASE}:latest-arm64"

      - name: Inspect versioned image
        run: |
          docker buildx imagetools inspect \
            "${{ steps.vars.outputs.image_version_v }}"

      - name: Inspect SHA image
        run: |
          docker buildx imagetools inspect \
            "${{ steps.vars.outputs.image_sha }}"

      - name: Inspect latest image
        run: |
          docker buildx imagetools inspect \
            "${{ steps.vars.outputs.image_latest }}"

      - name: Notify Slack — success
        if: success()
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ secrets.SLACK_CHANNEL_ID }}"
            text: ":rocket: *${{ github.repository }}* released ${{ steps.vars.outputs.version_v }}"
            attachments:
              - color: "good"
                fields:
                  - title: "Version"
                    value: "${{ steps.vars.outputs.version_v }}"
                    short: true

                  - title: "SHA"
                    value: "${{ steps.vars.outputs.sha_short }}"
                    short: true

                  - title: "Image"
                    value: "`${{ steps.vars.outputs.image_version_v }}`"
                    short: false

                  - title: "SHA image"
                    value: "`${{ steps.vars.outputs.image_sha }}`"
                    short: false

                  - title: "Latest"
                    value: "`${{ steps.vars.outputs.image_latest }}`"
                    short: false

                  - title: "By"
                    value: "${{ github.actor }}"
                    short: true


  notify-failure:
    name: Notify Slack — release failure
    runs-on: ubuntu-latest

    needs:
      - build-amd64
      - build-arm64
      - merge-manifest

    if: >-
      always() &&
      (
        needs.build-amd64.result == 'failure' ||
        needs.build-arm64.result == 'failure' ||
        needs.merge-manifest.result == 'failure'
      )

    permissions:
      contents: read

    steps:
      - name: Notify Slack — failure
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ secrets.SLACK_CHANNEL_ID }}"
            text: ":x: *${{ github.repository }}* release ${{ github.ref_name }} failed"
            attachments:
              - color: "danger"
                fields:
                  - title: "Build status"
                    value: "amd64=${{ needs.build-amd64.result }}, arm64=${{ needs.build-arm64.result }}, manifest=${{ needs.merge-manifest.result }}"
                    short: false

                  - title: "Run"
                    value: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver logs>"
                    short: true

                  - title: "By"
                    value: "${{ github.actor }}"
                    short: true
