name: Release

on:
  push:
    tags: ['v*.*.*', 'sentinella-hub-k8s-agent-v*.*.*']

env:
  PROJECT_ID: sentinella-hub
  REGION: us-east1
  REPOSITORY: kubernetes-agent
  IMAGE: sentinella-hub-k8s-agent

jobs:
  build-amd64:
    name: Build image (linux/amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image vars
        id: vars
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#sentinella-hub-k8s-agent-}"
          BASE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "image_version=${BASE}:${VERSION}-amd64" >> $GITHUB_OUTPUT
          echo "image_latest=${BASE}:latest-amd64" >> $GITHUB_OUTPUT

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.vars.outputs.image_version }}
            ${{ steps.vars.outputs.image_latest }}
          cache-from: type=registry,ref=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest-amd64
          cache-to: type=inline

  build-arm64:
    name: Build image (linux/arm64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image vars
        id: vars
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#sentinella-hub-k8s-agent-}"
          BASE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "image_version=${BASE}:${VERSION}-arm64" >> $GITHUB_OUTPUT
          echo "image_latest=${BASE}:latest-arm64" >> $GITHUB_OUTPUT

      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.vars.outputs.image_version }}
            ${{ steps.vars.outputs.image_latest }}
          cache-from: type=registry,ref=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest-arm64
          cache-to: type=inline

  merge-manifest:
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image vars
        id: vars
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#sentinella-hub-k8s-agent-}"
          BASE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "image_version=${BASE}:${VERSION}" >> $GITHUB_OUTPUT
          echo "image_latest=${BASE}:latest" >> $GITHUB_OUTPUT

      - name: Merge per-arch images into a multi-arch manifest
        run: |
          BASE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}"
          VERSION="${{ steps.vars.outputs.version }}"
          docker buildx imagetools create --tag "${BASE}:${VERSION}" \
            "${BASE}:${VERSION}-amd64" \
            "${BASE}:${VERSION}-arm64"
          docker buildx imagetools create --tag "${BASE}:latest" \
            "${BASE}:latest-amd64" \
            "${BASE}:latest-arm64"

      - name: Notify Slack — success
        if: success()
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ secrets.SLACK_CHANNEL_ID }}"
            text: ":rocket: *${{ github.repository }}* released ${{ steps.vars.outputs.version }}"
            attachments:
              - color: "good"
                fields:
                  - title: "Version"
                    value: "${{ steps.vars.outputs.version }}"
                    short: true
                  - title: "Image"
                    value: "`${{ steps.vars.outputs.image_version }}`"
                    short: false
                  - title: "By"
                    value: "${{ github.actor }}"
                    short: true

      - name: Notify Slack — failure
        if: failure()
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ secrets.SLACK_CHANNEL_ID }}"
            text: ":x: *${{ github.repository }}* release ${{ steps.vars.outputs.version }} failed"
            attachments:
              - color: "danger"
                fields:
                  - title: "Run"
                    value: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver logs>"
                    short: true
                  - title: "By"
                    value: "${{ github.actor }}"
                    short: true
