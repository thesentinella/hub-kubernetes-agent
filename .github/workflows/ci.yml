name: CI

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  changes:
    name: Detect build-relevant changes
    runs-on: ubuntu-latest

    outputs:
      docker: ${{ steps.filter.outputs.docker }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect build-relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - 'src/**'
              - 'proto/**'
              - '.github/workflows/**'

  check:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify installer manifest checksum
        run: |
          expected="$(awk -F'"' '/^MANIFEST_SHA256=/{print $2}' install.sh)"
          actual="$(sha256sum agent.yaml | awk '{print $1}')"
          test "$expected" = "$actual"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Tests
        run: cargo test

      - name: Build
        run: cargo build --release

  docker-amd64:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [changes]

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: needs.changes.outputs.docker == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: needs.changes.outputs.docker == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push, native arch)
        if: needs.changes.outputs.docker == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false

  docker-arm64:
    name: Verify aarch64 build
    runs-on: ubuntu-24.04-arm
    needs: [changes]
    if: needs.changes.outputs.docker == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false

  notify-failure:
    name: Notify CI failure
    runs-on: ubuntu-latest
    needs: [changes, check, docker-amd64, docker-arm64]
    if: failure()

    steps:
      - name: Notify Slack — CI failed
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ secrets.SLACK_CHANNEL_ID }}"
            text: ":x: *CI falló en PR de ${{ github.repository }}*"
            attachments:
              - color: "danger"
                fields:
                  - title: "PR"
                    value: "<${{ github.event.pull_request.html_url }}|#${{ github.event.pull_request.number }} ${{ github.event.pull_request.title }}>"
                    short: false
                  - title: "Autor"
                    value: "${{ github.actor }}"
                    short: true
                  - title: "Run"
                    value: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver logs>"
                    short: true
